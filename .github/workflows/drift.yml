name: API contract

on:
  pull_request:

# Least privilege: read the code, write one pull-request comment.
permissions:
  contents: read
  pull-requests: write

jobs:
  drift:
    name: DRIFT contract gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: DRIFT
        id: drift
        # Pinned to a full commit SHA of the DRIFT repository.
        uses: Yugvyas10/DRIFT1.2version/packages/github-action@f9d4209366148e5da3e49f9d7db2bd7238b3d437
        with:
          spec: openapi.yaml
          traffic: traffic.jsonl
      - name: Keep the reports (JSON, Markdown, HTML, SARIF)
        if: always() && steps.drift.outputs.report-dir != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: drift-report
          path: ${{ steps.drift.outputs.report-dir }}
